[package]
name = "akr-gui"
description = "Read-only native desktop review workbench for AKR ledgers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "akr_gui"
path = "src/lib.rs"

[[bin]]
name = "akr-gui"
path = "src/main.rs"

# `fts5` is forwarded, not inherited. Every other crate takes akr-cli/akr-core with
# `default-features = false` and re-exports the feature explicitly; this one took the
# defaults, and because cargo unifies features across a workspace build that quietly
# switched FTS5 back on for `cargo test --no-default-features` at the workspace root. The
# no-FTS path then went untested for as long as this crate has existed, and the one place
# it was exercised (`-p akr-cli -p akr-mcp`) looked broken instead.
[features]
default = ["fts5"]
fts5 = ["akr-cli/fts5"]

# Presentation is pixelkit: software rasterizer, TrueType text, immediate-mode
# widgets, and the winit/softbuffer window host. Pinned to a revision so
# every checkout builds the same pixels.
[dependencies]
akr-cli = { path = "../akr-cli", default-features = false }
pixelkit-raster = { git = "https://github.com/liminalism/pixelkit.git", rev = "614c9c6e84ce3cd0bc6c81988f636b493b30a497" }
pixelkit-text = { git = "https://github.com/liminalism/pixelkit.git", rev = "614c9c6e84ce3cd0bc6c81988f636b493b30a497" }
pixelkit-shell = { git = "https://github.com/liminalism/pixelkit.git", rev = "614c9c6e84ce3cd0bc6c81988f636b493b30a497" }
pixelkit-ui = { git = "https://github.com/liminalism/pixelkit.git", rev = "614c9c6e84ce3cd0bc6c81988f636b493b30a497" }
pixelkit-windowing = { git = "https://github.com/liminalism/pixelkit.git", rev = "614c9c6e84ce3cd0bc6c81988f636b493b30a497" }
